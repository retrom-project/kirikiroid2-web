name: RPG Runtime Quality

on:
  pull_request:
    branches: ["retrom/g13dda190f837"]
  # Populate the default branch cache when toolchain/dependency inputs change.
  # PR and tag caches cannot supply another PR or another tag.
  push:
    branches: ["retrom/g13dda190f837"]
    paths:
      - .github/workflows/rpg-runtime-*.yml
      - .github/rpg-runtime/build-web.sh
      - .github/rpg-runtime/toolchain.env
      - .github/rpg-runtime/emscripten-ports.txt
      - CMakePresets.json
      - vcpkg.json
      - vcpkg-configuration.json
      - vcpkg/**
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Bypass cache restore to measure a cold build
        type: boolean
        default: false
      build-jobs:
        description: Parallel core compiler jobs
        type: choice
        default: "4"
        options: ["4", "2"]

permissions:
  contents: read

concurrency:
  group: rpg-runtime-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libsqlite3-dev pkg-config
      - name: Validate source and native regressions
        run: .github/rpg-runtime/check-source.sh
  web:
    needs: source
    uses: ./.github/workflows/rpg-runtime-build.yml
    with:
      release-tag: retrom-core-g13dda190f837-r1-rc.1
      sqlite-binding: true
      cold-cache: ${{ inputs.cold-cache || false }}
      build-jobs: ${{ inputs.build-jobs || '4' }}
  candidate:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.web.outputs.artifact-id }}
          path: ${{ runner.temp }}/rpg-runtime-output
          merge-multiple: true
      - name: Check downloaded candidate identity and integrity
        run: |
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag retrom-core-g13dda190f837-r1-rc.1 \
            --commit "$GITHUB_SHA" --check-existing
  # Preserve the existing required status name, and fail on skipped dependencies.
  quality:
    needs: [source, web, candidate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$WEB_RESULT" = success
          test "$CANDIDATE_RESULT" = success
