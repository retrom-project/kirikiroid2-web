name: RPG Runtime Release

on:
  push:
    tags: ["retrom-core-g13dda190f837-r*"]

permissions:
  contents: read

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release identity
        run: .github/rpg-runtime/verify-release-identity.sh
  web:
    needs: identity
    uses: ./.github/workflows/rpg-runtime-build.yml
    with:
      release-tag: ${{ github.ref_name }}
  release:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.web.outputs.artifact-id }}
          path: ${{ runner.temp }}/rpg-runtime-output
          merge-multiple: true
      - name: Recheck tag and downloaded assets
        run: |
          .github/rpg-runtime/verify-release-identity.sh
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --check-existing
      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --target "$GITHUB_SHA" \
            --title "KiriKiri Web $GITHUB_REF_NAME" --generate-notes \
            "$RUNNER_TEMP/rpg-runtime-output/index.js" \
            "$RUNNER_TEMP/rpg-runtime-output/index.wasm" \
            "$RUNNER_TEMP/rpg-runtime-output/vlfs.js" \
            "$RUNNER_TEMP/rpg-runtime-output/assets.zip" \
            "$RUNNER_TEMP/rpg-runtime-output/LICENSE" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"
